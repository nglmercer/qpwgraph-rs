[workspace]
resolver = "2"
members = [
    "crates/pw-graph-utils",
    "crates/pw-graph-app-core",
    "crates/pw-graph-core",
    "crates/pw-graph-effects",
    "crates/pw-graph-backend",
    "crates/pw-graph-alsamidi",
    "crates/pw-graph-command",
    "crates/pw-graph-patchbay",
    "crates/pw-graph-config",
    "crates/pw-graph-i18n",
    "crates/pw-graph-slint",
    "crates/pw-graph-relay",
    "crates/pw-graph-relay-sdk",
    "crates/pw-graph-relay-android",
    "crates/windows-audio-test-tone",
    "vendor/nnnoiseless",
]
exclude = ["drivers/windows-audio"]

[patch.crates-io]
audiopus_sys = { path = "vendor/audiopus_sys" }
libspa = { path = "vendor/libspa" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["qpwgraph-rs contributors"]

[workspace.dependencies]
anyhow = "1.0"
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "renderer-software"] }
slint-build = "=1.17.1"
rfd = "0.15"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
pipewire = "0.8"
windows = "0.62.2"
windows-core = "0.62.2"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
spake2 = "0.4"
chacha20poly1305 = "0.10"
subtle = "2"
rand = "0.8"
opus = "0.3"
socket2 = "0.5"
libc = "0.2"
mdns-sd = "0.13"
netdev = "0.31"
qrcode = { version = "0.14", default-features = false }
