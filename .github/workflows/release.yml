name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

# Build jobs only read the repository. Write access is granted to the single
# job that actually creates and uploads the GitHub Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  native:
    name: Native Linux and AppImage
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          # These jobs only read source. The release publication below
          # authenticates explicitly with its own scoped GITHUB_TOKEN, so no
          # job needs a credential left behind in the checkout's git config.
          persist-credentials: false

      - name: Validate release tag and workspace version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vX.Y.Z or vX.Y.Z-rc.1: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "pw-graph-app") | .version')"
          if [[ -z "$package_version" || "${tag_version%%-*}" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match pw-graph-app version $package_version" >&2
            exit 1
          fi

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libclang-dev libasound2-dev libopus-dev libpipewire-0.3-dev libgtk-3-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run locked workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked -p pw-graph-app

      - name: Package native release
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          package_name="qpwgraph-rs-${tag_version}-${target}"
          staging_dir="${RUNNER_TEMP}/qpwgraph-rs-release"
          asset_dir="${GITHUB_WORKSPACE}/dist"
          package_root="${staging_dir}/${package_name}"

          rm -rf "$staging_dir" "$asset_dir"
          mkdir -p "$package_root"

          install -Dm755 target/release/qpwgraph-rs \
            "$package_root/bin/qpwgraph-rs"
          install -Dm644 README.md \
            "$package_root/README.md"
          install -Dm644 packaging/README.md \
            "$package_root/PACKAGING.md"
          install -Dm644 docs/adaptive-noise-reduction.md \
            "$package_root/share/doc/qpwgraph-rs/adaptive-noise-reduction.md"
          install -Dm644 LICENSE \
            "$package_root/share/licenses/qpwgraph-rs/LICENSE"
          install -Dm644 packaging/io.github.nglmercer.qpwgraph-rs.desktop \
            "$package_root/share/applications/io.github.nglmercer.qpwgraph-rs.desktop"
          install -Dm644 packaging/io.github.nglmercer.qpwgraph-rs.metainfo.xml \
            "$package_root/share/metainfo/io.github.nglmercer.qpwgraph-rs.metainfo.xml"
          install -Dm644 packaging/io.github.nglmercer.qpwgraph-rs.svg \
            "$package_root/share/icons/hicolor/scalable/apps/io.github.nglmercer.qpwgraph-rs.svg"
          install -Dm644 vendor/audiopus_sys/LICENSE.md \
            "$package_root/share/licenses/qpwgraph-rs/audiopus_sys-LICENSE.md"
          install -Dm644 vendor/audiopus_sys/opus/COPYING \
            "$package_root/share/licenses/qpwgraph-rs/opus-COPYING"
          install -Dm644 vendor/libspa/LICENSE \
            "$package_root/share/licenses/qpwgraph-rs/libspa-LICENSE"
          install -Dm644 vendor/nnnoiseless/COPYING \
            "$package_root/share/licenses/qpwgraph-rs/nnnoiseless-COPYING"

          mkdir -p "$asset_dir"
          archive="${package_name}.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime='UTC 1970-01-01' \
            -czf "$asset_dir/$archive" \
            -C "$staging_dir" "$package_name"
          (cd "$asset_dir" && sha256sum "$archive" > "${archive}.sha256")

      - name: Download linuxdeploy
        shell: bash
        run: |
          set -euo pipefail
          linuxdeploy_version=1-alpha-20251107-1
          # SHA-256 of linuxdeploy-x86_64.AppImage from the pinned upstream
          # release, as published by the GitHub release API for that asset.
          # A pinned version alone still trusts whatever bytes the download
          # returns, so verify before making the file executable.
          linuxdeploy_sha256=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          linuxdeploy_path="${RUNNER_TEMP}/linuxdeploy-x86_64.AppImage"
          curl --fail --location --silent --show-error \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${linuxdeploy_version}/linuxdeploy-x86_64.AppImage" \
            --output "$linuxdeploy_path"
          echo "${linuxdeploy_sha256}  ${linuxdeploy_path}" | sha256sum --check -
          chmod +x "$linuxdeploy_path"
          echo "LINUXDEPLOY_PATH=$linuxdeploy_path" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh "${RELEASE_TAG#v}" "$LINUXDEPLOY_PATH" dist

      - name: Upload native release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-assets
          path: dist/
          if-no-files-found: error

  flatpak:
    name: Standalone Flatpak bundle
    runs-on: ubuntu-22.04
    container:
      # Pinned by immutable digest; the tag it currently resolves to is
      # freedesktop-25.08. Digest read from ghcr.io's manifest endpoint for
      # that tag (an OCI image index, so it still selects the right
      # architecture). Update both halves together.
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:68c521931eccf47dfa05c1c80f43be0993cce516417a633aa34913707da57cf2
      options: --privileged
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          # These jobs only read source. The release publication below
          # authenticates explicitly with its own scoped GITHUB_TOKEN, so no
          # job needs a credential left behind in the checkout's git config.
          persist-credentials: false

      - name: Build Flatpak repository
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: packaging/io.github.nglmercer.qpwgraph-rs.yml
          branch: stable
          build-bundle: false
          repository-name: flathub
          cache-key: flatpak-builder-${{ github.sha }}
          repo-dir: repo
          upload-artifact: false

      - name: Create standalone Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          mkdir -p dist
          flatpak build-bundle repo \
            "dist/qpwgraph-rs-${tag_version}-x86_64.flatpak" \
            io.github.nglmercer.qpwgraph-rs stable \
            --runtime-repo=https://releases.freedesktop-sdk.io/freedesktop-sdk.flatpakrepo

      - name: Upload Flatpak release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-release-assets
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows portable ZIP
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          # These jobs only read source. The release publication below
          # authenticates explicitly with its own scoped GITHUB_TOKEN, so no
          # job needs a credential left behind in the checkout's git config.
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Run Windows checks
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo xtask check -p pw-graph-app --locked
          cargo xtask test --workspace --locked
          cargo xtask clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Windows release binary
        run: cargo xtask build --release --locked -p pw-graph-app

      - name: Package Windows portable ZIP
        shell: pwsh
        run: |
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          $target = "x86_64-pc-windows-msvc"
          $packageName = "qpwgraph-rs-$tagVersion-$target"
          $staging = Join-Path $env:RUNNER_TEMP "qpwgraph-rs-windows-release"
          $packageRoot = Join-Path $staging $packageName
          $assetDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          $archive = Join-Path $assetDir "$packageName.zip"

          if (Test-Path -LiteralPath $staging) {
            Remove-Item -LiteralPath $staging -Recurse -Force
          }
          if (Test-Path -LiteralPath $assetDir) {
            Remove-Item -LiteralPath $assetDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          Copy-Item -LiteralPath "target\release\qpwgraph-rs.exe" -Destination $packageRoot
          Copy-Item -LiteralPath "README.md" -Destination $packageRoot
          Copy-Item -LiteralPath "LICENSE" -Destination $packageRoot
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $archive

      - name: Upload Windows release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [native, flatpak, windows]
    runs-on: ubuntu-latest
    # The only job that writes to the repository.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release-assets'
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -lh dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_flags=(--verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" "${release_flags[@]}"
          fi
