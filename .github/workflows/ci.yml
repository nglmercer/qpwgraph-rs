name: CI

on:
  push:
  pull_request:
  # A maintainer needs a way to run the whole matrix on demand, without
  # inventing a commit to hang it off.
  workflow_dispatch:

# Nothing in CI writes to the repository; the release workflow grants its own
# narrower permissions where they are actually needed.
permissions:
  contents: read

env:
  # Pinned so a future release of either tool cannot silently change what CI
  # runs. Both versions are the current maintained releases and are known to
  # pass this repository's checks.
  CARGO_NDK_VERSION: "4.1.2"
  CARGO_DENY_VERSION: "0.20.2"
  # Every compilation, not just the clippy runs. `cargo check` on a feature
  # subset used to report warnings and pass, so an unused import behind a
  # feature gate could only be found by building that subset by hand. Registry
  # dependencies are unaffected -- cargo caps their lints -- so this covers the
  # workspace and the vendored path crates, which is exactly the code this
  # repository is responsible for.
  RUSTFLAGS: "-D warnings"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Prevent legacy UI dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately POSIX `grep` rather than `rg`. An earlier version of
          # this guard called `ripgrep`, which is not on the Ubuntu runner
          # image: `rg` exited 127 with "command not found", bash read that as
          # a false `if` condition, and the step passed while checking
          # nothing. Assert the tool exists before relying on its exit status,
          # so a missing utility can never again be mistaken for a clean tree.
          command -v grep >/dev/null || { echo "grep is unavailable" >&2; exit 1; }
          if grep -rInE --include='*.rs' --include='*.toml' \
            '(^|[^[:alnum:]_])(egui|eframe|egui_extras)([^[:alnum:]_]|$)' \
            Cargo.toml crates; then
            echo "legacy desktop UI dependency/source usage was reintroduced" >&2
            exit 1
          fi
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libclang-dev libasound2-dev libopus-dev libpipewire-0.3-dev libgtk-3-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Minimal Slint application build
        run: cargo check -p pw-graph-app --locked --no-default-features
      - name: PipeWire-only Slint application build
        run: cargo check -p pw-graph-app --locked --no-default-features --features pipewire
      - name: ALSA-only Slint application build
        run: cargo check -p pw-graph-app --locked --no-default-features --features alsa
      - name: PipeWire and ALSA Slint application build
        run: cargo check -p pw-graph-app --locked --no-default-features --features pipewire,alsa
      - name: PipeWire and relay Slint application build
        run: cargo check -p pw-graph-app --locked --no-default-features --features pipewire,relay
      - name: Full Slint application build
        run: cargo check -p pw-graph-app --locked --all-features
      - name: Locked release build
        run: cargo build --release --locked -p pw-graph-app

  android:
    name: Android JNI bridge
    runs-on: ubuntu-latest
    # A Linux `cargo test --workspace` never compiles this crate for Android:
    # the JNI bridge, the Opus native build, and the `cdylib` link step are all
    # target-specific, so a break here is invisible to every other job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libclang-dev
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Point cargo-ndk at the runner's NDK
        # The runner image exports several NDK locations. cargo-ndk reads both
        # ANDROID_NDK_HOME and ANDROID_NDK_ROOT and warns when they disagree,
        # so pick one deliberately and set both to it.
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build the relay bridge for arm64-v8a
        run: cargo ndk -t arm64-v8a build -p pw-graph-relay-android --locked
      - name: Build the relay bridge for armeabi-v7a
        run: cargo ndk -t armeabi-v7a build -p pw-graph-relay-android --locked
      - name: Clippy for Android
        run: cargo ndk -t arm64-v8a clippy -p pw-graph-relay-android --all-targets -- -D warnings

  android-app:
    name: Android app checks
    runs-on: ubuntu-latest
    # The job above proves only that the Rust JNI bridge compiles. Nothing
    # else in CI reads the Kotlin and Compose sources, the manifest, the
    # adaptive launcher icons, the notification drawable, or the Android unit
    # tests, so an Android-only commit could break the shipped application
    # while every other job stayed green.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libclang-dev
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Point cargo-ndk at the runner's NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build the JNI libraries into the app's jniLibs
        # `android/app/src/main/jniLibs` is gitignored: the `.so` files are
        # build output and are produced here rather than committed.
        run: |
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs \
            build -p pw-graph-relay-android --locked
          cargo ndk -t armeabi-v7a -o android/app/src/main/jniLibs \
            build -p pw-graph-relay-android --locked
      - name: Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Android lint
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

  audit:
    name: Dependency advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Check advisories, bans, licences, and sources
        run: cargo deny --all-features check

  windows:
    name: Windows MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The Windows backend is heavily feature-gated -- the router is always
      # compiled, the relay endpoints and the tray are not -- so a subset that
      # nobody builds is a subset that breaks quietly. Each of these is a state
      # a user can actually ship.
      - name: Minimal application build
        run: cargo check -p pw-graph-app --locked --no-default-features
      - name: Relay-only application build
        run: cargo check -p pw-graph-app --locked --no-default-features --features relay
      - name: Tray-only application build
        run: cargo check -p pw-graph-app --locked --no-default-features --features tray
      - name: Relay and tray application build
        run: cargo check -p pw-graph-app --locked --no-default-features --features relay,tray
      - name: Default application build
        run: cargo check -p pw-graph-app --locked
      - name: Full application build
        run: cargo check -p pw-graph-app --locked --all-features
      - name: Release build
        run: cargo build --release --locked -p pw-graph-app
      - name: Validate Windows driver package metadata
        shell: pwsh
        run: cargo run --manifest-path drivers/windows-audio/Cargo.toml -p qpwgraph-audio-xtask --locked -- --validate-package
      - name: Windows driver ring-core tests
        run: cargo test --manifest-path drivers/windows-audio/Cargo.toml -p qpwgraph-audio-core --locked

  # Kernel-driver compilation requires an eWDK environment and cannot run on
  # the ordinary GitHub-hosted Windows image. A repository variable enables a
  # dedicated/self-hosted runner without making the portable application CI
  # depend on privileged machine state.
  windows-driver:
    name: Windows Rust driver (eWDK opt-in)
    if: ${{ vars.QPWGRAPH_EWDK_CI == 'true' }}
    runs-on: [self-hosted, windows, ewdk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Validate Windows driver package metadata
        shell: pwsh
        run: cargo run --manifest-path drivers/windows-audio/Cargo.toml -p qpwgraph-audio-xtask --locked -- --validate-package
      - name: Verify the eWDK environment
        shell: pwsh
        run: cargo run --manifest-path drivers/windows-audio/Cargo.toml -p qpwgraph-audio-xtask --locked -- --audit-toolchain
      - name: Compile the opt-in ACX binding surface
        shell: pwsh
        run: cargo check --manifest-path drivers/windows-audio/Cargo.toml -p qpwgraph-audio --features acx --locked
      - name: Test allocation-free driver core
        run: cargo test --manifest-path drivers/windows-audio/Cargo.toml -p qpwgraph-audio-core --locked
      - name: Build and package the KMDF driver
        shell: cmd
        run: cargo make --cwd drivers/windows-audio

  ci:
    name: CI
    runs-on: ubuntu-latest
    # A required check that depends on every mandatory job and the opt-in
    # driver job. The shell gate below treats the intentionally skipped eWDK
    # job as neutral, but requires it to succeed when enabled.
    needs: [checks, android, android-app, audit, windows, windows-driver]
    if: always()
    steps:
      - name: Every job succeeded
        shell: bash
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_APP_RESULT: ${{ needs['android-app'].result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_DRIVER_RESULT: ${{ needs['windows-driver'].result }}
          EWDK_ENABLED: ${{ vars.QPWGRAPH_EWDK_CI }}
        run: |
          set -euo pipefail
          required_results="$CHECKS_RESULT $ANDROID_RESULT $ANDROID_APP_RESULT $AUDIT_RESULT $WINDOWS_RESULT"
          echo "required job results: $required_results"
          for result in $required_results; do
            if [ "$result" != "success" ]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
          driver_result="$WINDOWS_DRIVER_RESULT"
          echo "optional eWDK job result: $driver_result"
          if [ "$EWDK_ENABLED" = "true" ] && [ "$driver_result" != "success" ]; then
            echo "the opt-in eWDK job did not succeed" >&2
            exit 1
          fi
