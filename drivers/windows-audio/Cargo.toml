[workspace]
resolver = "2"
members = ["core", "driver", "xtask", "tests/smoke"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
version = "0.1.0"

[workspace.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[workspace.dependencies]
qpwgraph-audio-core = { path = "core" }
wdk = "0.4.1"
wdk-alloc = "0.4.1"
wdk-build = "0.5.1"
wdk-panic = "0.4.1"
wdk-sys = "0.5.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
