[package]
name = "pw-graph-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Workspace-internal: these crates depend on each other by path and are not
# published to crates.io.
publish = false

[features]
default = []
wasm = ["dep:wasmi"]

[dependencies]
nnnoiseless = { path = "../../vendor/nnnoiseless", default-features = false, features = ["hush"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
wasmi = { workspace = true, optional = true }

[dev-dependencies]
wat = "1"
