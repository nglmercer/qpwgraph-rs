[package]
name = "pw-graph-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Workspace-internal: these crates depend on each other by path and are not
# published to crates.io.
publish = false
build = "build.rs"

[[bin]]
name = "qpwgraph-rs"
path = "src/main.rs"

[features]
default = ["pipewire", "alsa", "relay", "tray"]
pipewire = ["pw-graph-backend/pipewire", "pw-graph-app-core/pipewire"]
alsa = ["dep:pw-graph-alsamidi", "pw-graph-alsamidi/alsa", "pw-graph-app-core/alsa"]
relay = ["pw-graph-backend/relay", "pw-graph-app-core/relay"]
tray = ["dep:ksni"]

[dependencies]
slint.workspace = true
pw-graph-app-core = { path = "../pw-graph-app-core", default-features = false }
pw-graph-backend = { path = "../pw-graph-backend", default-features = false }
pw-graph-command = { path = "../pw-graph-command" }
pw-graph-config = { path = "../pw-graph-config" }
pw-graph-core = { path = "../pw-graph-core" }
pw-graph-effects = { path = "../pw-graph-effects" }
pw-graph-i18n = { path = "../pw-graph-i18n" }
pw-graph-patchbay = { path = "../pw-graph-patchbay" }
pw-graph-utils = { path = "../pw-graph-utils" }
rfd.workspace = true
serde.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"], optional = true }
pw-graph-alsamidi = { path = "../pw-graph-alsamidi", default-features = false, optional = true }

# The notification-area tray. Only the window, menu, and shell-icon surfaces:
# the tray runs its own hidden window and touches nothing else.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Ole",
] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing = "=1.17.1"
