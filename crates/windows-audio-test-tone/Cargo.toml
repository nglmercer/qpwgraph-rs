[package]
name = "windows-audio-test-tone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
relay-tests = ["pw-graph-backend/relay"]

[[bin]]
name = "qpwgraph-backend-crash-host"
path = "src/bin/backend_crash_host.rs"

[target.'cfg(target_os = "windows")'.dependencies]
pw-graph-backend = { path = "../pw-graph-backend" }
pw-graph-config = { path = "../pw-graph-config" }
windows = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
pw-graph-core = { path = "../pw-graph-core" }
pw-graph-effects = { path = "../pw-graph-effects" }
