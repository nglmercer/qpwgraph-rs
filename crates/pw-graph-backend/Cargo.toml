[package]
name = "pw-graph-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Workspace-internal: these crates depend on each other by path and are not
# published to crates.io.
publish = false
[features]
default = ["in-memory"]
in-memory = []
pipewire = ["dep:pipewire"]
relay = ["dep:pw-graph-relay"]
wasm = ["pw-graph-effects/wasm"]
# Live XDG ScreenCast portal access via ashpd (Linux only). Off by default so
# headless CI builds without a D-Bus session or compositor. The portal state
# machine, session tracking, and virtual-display detection API are always
# compiled; only the live D-Bus connector is feature-gated.
#
# ashpd must use its `async-std` runtime: the app pulls `rfd`, which enables
# `ashpd/async-std`, and ashpd 0.11 refuses to build with both `async-std`
# and `tokio` at once. The connector drives futures with `pollster` (the
# same crate rfd uses) plus `async_io::Timer`, so no second runtime enters
# the tree — both crates are already in the lockfile.
screencast = ["dep:ashpd", "dep:pollster", "dep:async-io", "dep:futures-util"]

[dependencies]
pw-graph-core = { path = "../pw-graph-core" }
pw-graph-config = { path = "../pw-graph-config" }
pw-graph-effects = { path = "../pw-graph-effects" }
pw-graph-video = { path = "../pw-graph-video" }
thiserror.workspace = true
serde_json.workspace = true
pw-graph-utils = { path = "../pw-graph-utils" }
# The relay engine (pairing, transport, codec, discovery) is portable; only
# the audio endpoints that feed it are platform specific.
pw-graph-relay = { path = "../pw-graph-relay", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { workspace = true, optional = true }
ashpd = { version = "0.11", optional = true, default-features = false, features = ["async-std"] }
pollster = { version = "0.4", optional = true }
async-io = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_ProcessStatus",
    "Win32_System_WinRT",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_Shell_PropertiesSystem",
    "Wdk_System_SystemServices",
] }
windows-core.workspace = true
sha2.workspace = true
