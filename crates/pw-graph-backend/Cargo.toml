[package]
name = "pw-graph-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Workspace-internal: these crates depend on each other by path and are not
# published to crates.io.
publish = false
[features]
default = ["in-memory"]
in-memory = []
pipewire = ["dep:pipewire"]
relay = ["dep:pw-graph-relay"]

[dependencies]
pw-graph-core = { path = "../pw-graph-core" }
pw-graph-config = { path = "../pw-graph-config" }
pw-graph-effects = { path = "../pw-graph-effects" }
thiserror.workspace = true
serde_json.workspace = true
pw-graph-utils = { path = "../pw-graph-utils" }
# The relay engine (pairing, transport, codec, discovery) is portable; only
# the audio endpoints that feed it are platform specific.
pw-graph-relay = { path = "../pw-graph-relay", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_Properties",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_Shell_PropertiesSystem",
    "Wdk_System_SystemServices",
] }
windows-core.workspace = true
sha2.workspace = true
